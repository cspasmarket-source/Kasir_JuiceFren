function productCards(p){return p.length?p.map(x=>`<button class="product" data-add="${esc(x.id)}"><div class="photo">${x.image?`<img src="${esc(x.image)}" alt="">`:'🥤'}</div><div class="info"><b>${esc(x.name)}</b><small>${esc(x.description||x.category||'Minuman')}</small><strong>${money(x.price)}</strong></div></button>`).join(''):empty('Belum ada produk aktif. Owner perlu menambahkan produk.')}

const configs={products:{title:'Produk & Varian',desc:'Kelola katalog, harga, HPP, foto, dan kategori',fields:[['name','Nama Produk','text'],['category','Kategori','text'],['description','Deskripsi','text'],['price','Harga Jual','number'],['hpp','HPP per Produk','number'],['size','Ukuran Cup','text'],['image','URL Foto (opsional)','text']]},outlets:{title:'Manajemen Outlet',desc:'Kelola lokasi dan target penjualan',fields:[['name','Nama Outlet','text'],['address','Alamat','text'],['maps','Link Google Maps','text'],['phone','WhatsApp Outlet','text'],['dailyTarget','Target Harian','number'],['weeklyTarget','Target Mingguan','number'],['monthlyTarget','Target Bulanan','number']]},inventory:{title:'Inventori & Stok',desc:'Kelola bahan baku, satuan, dan batas minimum',fields:[['name','Nama Bahan','text'],['unit','Satuan (kg, liter, pcs)','text'],['qty','Jumlah Stok','number'],['min','Batas Minimum','number'],['cost','Harga Pokok per Satuan','number']]},suppliers:{title:'Supplier & Pembelian',desc:'Data pemasok dan kontak pembelian',fields:[['name','Nama Supplier','text'],['phone','Nomor Kontak','text'],['address','Alamat','text'],['notes','Catatan','text']]},customers:{title:'Pelanggan & Loyalti',desc:'Data pelanggan dan poin loyalti',fields:[['name','Nama Pelanggan','text'],['phone','Nomor HP','text'],['points','Poin','number'],['notes','Catatan','text']]},users:{title:'Manajemen Karyawan',desc:'Akun, PIN, dan hak akses lokal',fields:[['name','Nama Lengkap','text'],['username','Username','text'],['pin','PIN / Password','text'],['role','Peran (kasir/dapur/supervisor)','text']]}};
function genericPage(key){let c=configs[key],arr=state[key],rows=arr.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="sub">${esc(x.category||x.address||x.unit||x.username||'')}</div></td><td>${key==='products'?money(x.price):key==='inventory'?`${x.qty} ${esc(x.unit)}`:key==='outlets'?money(x.dailyTarget):key==='customers'?x.points||0:key==='users'?esc(x.role):esc(x.phone||'—')}</td><td><span class="tag ${x.active===false?'red':''}">${x.active===false?'Nonaktif':'Aktif'}</span></td><td><div class="row"><button class="ghost small" data-edit="${key}:${x.id}">Edit</button><button class="outline small" data-toggle="${key}:${x.id}">${x.active===false?'Aktifkan':'Nonaktifkan'}</button>${!['users'].includes(key)?`<button class="outline small" data-delete="${key}:${x.id}">Hapus</button>`:''}</div></td></tr>`);return heading(c.title,c.desc,button('+ Tambah','add:'+key))+`<div class="panel"><div class="toolbar"><input id="listSearch" placeholder="Cari data..."><span class="tag">${arr.length} data</span></div><div id="listTable">${table(['Nama / Detail',key==='products'?'Harga':key==='inventory'?'Stok':'Informasi','Status','Tindakan'],rows)}</div></div>${key==='inventory'?`<div class="notice" style="margin-top:15px">Stok di sini dikelola manual. Pengurangan otomatis berdasarkan resep/BOM belum tersedia dalam implementasi lokal ini.</div>`:''}`}
function formModal(key,id){let c=configs[key],x=id?item(key,id):{},fields=c.fields.map(([k,l,t])=>`<div class="${['description','address','notes'].includes(k)?'wide':''}"><label>${l}</label><input id="f_${k}" type="${t}" ${t==='number'?'min="0" step="any"':''} value="${esc(x?.[k]??'')}"></div>`).join('');showModal(`<h2>${id?'Edit':'Tambah'} ${c.title}</h2><div class="fieldgrid">${fields}</div><div class="row" style="margin-top:20px"><button id="saveForm">Simpan</button><button class="outline" id="cancelModal">Batal</button></div>`);$('#saveForm').onclick=async()=>{let obj=id?item(key,id):{id:uid(),active:true};for(let [k,l,t]of c.fields){let v=val('f_'+k).trim();if(t==='number'){v=Number(v);if(!Number.isFinite(v)||v<0){toast(l+' tidak valid',true);return}}obj[k]=v}if(!obj.name){toast('Nama wajib diisi',true);return}if(key==='users'&&(!obj.username||!obj.pin)){toast('Username dan PIN wajib diisi',true);return}if(key==='users'&&state.users.some(u=>u.id!==obj.id&&u.username===obj.username)){toast('Username sudah digunakan',true);return}if(key==='users'&&obj.role==='owner'&&obj.id!=='owner'){toast('Akun Owner baru tidak tersedia dalam demo lokal',true);return}if(key==='users')obj.mustChange=!id;if(!id)state[key].push(obj);await commit(id?'Edit data':'Tambah data',key+' '+obj.name);hideModal();render()};$('#cancelModal').onclick=hideModal}

function analytics(){let tx=txReal(),total=tx.reduce((n,x)=>n+x.total,0),byPay=['cash','qris'].map(k=>({label:k==='cash'?'Tunai':'QRIS',v:tx.filter(x=>x.payment===k).reduce((n,x)=>n+x.total,0)}));let monthly=Array.from({length:12},(_,i)=>({label:String(i+1),v:tx.filter(x=>new Date(x.at).getMonth()===i&&new Date(x.at).getFullYear()===new Date().getFullYear()).reduce((n,x)=>n+x.total,0)}));return heading('Omzet & Analitik','Seluruh grafik menggunakan transaksi berhasil yang tersimpan')+`<div class="cards"><div class="card"><div class="sub">Total Omzet</div><div class="metric">${money(total)}</div></div><div class="card"><div class="sub">Jumlah Transaksi</div><div class="metric">${tx.length}</div></div><div class="card"><div class="sub">Rata-rata Transaksi</div><div class="metric">${money(total/(tx.length||1))}</div></div><div class="card"><div class="sub">Outlet Terdaftar</div><div class="metric">${state.outlets.length}</div></div></div><div class="twocol"><div class="panel"><h2>Omzet Bulanan Tahun Ini</h2>${bars(monthly)}</div><div class="panel"><h2>Metode Pembayaran</h2>${bars(byPay)}</div></div>`}

function auditPage(){return heading('Audit Log','Riwayat tindakan penting yang tersimpan secara lokal')+`<div class="panel">${table(['Waktu','Pengguna','Tindakan','Detail'],state.audit.slice(0,200).map(x=>`<tr><td>${date(x.at)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`))}</div>`}

function backupPage(){return heading('Backup & Restore','Cadangkan database ke file dan pulihkan jika diperlukan',`${button('Backup Sekarang','backup')}${button('Restore dari File','restore','outline')}`)+`<div class="notice warning">Google Drive OAuth direncanakan untuk versi 1.1 dan <b>belum terhubung</b>. Versi 1.0 menggunakan backup file lokal. Backup otomatis ke Drive tidak dapat dijalankan dari file HTML lokal biasa.</div><div class="twocol"><div class="panel"><h2>Status Backup</h2><p>Backup terakhir: <b>${state.backupHistory.length?date(state.backupHistory[0].at):'Belum ada'}</b></p><p>Jumlah riwayat: <b>${state.backupHistory.length}</b></p><p>Interval pengingat: <b>30 menit</b></p><p class="help">Backup setelah tutup shift akan mengunduh file cadangan; browser dapat meminta izin unduhan. Pastikan file benar-benar tersimpan.</p></div><div class="panel"><h2>Riwayat Backup</h2>${table(['Tanggal','Jenis','Status'],state.backupHistory.slice(0,20).map(x=>`<tr><td>${date(x.at)}</td><td>${esc(x.type)}</td><td><span class="tag">${esc(x.status)}</span></td></tr>`))}</div></div><input type="file" id="restoreFile" accept=".json,application/json" hidden>`}

function helpPage(){return heading('Panduan Penggunaan','Petunjuk singkat dan batasan versi lokal')+`<div class="panel"><h2>Mulai Menggunakan</h2><ol><li>Login Owner dan ubah password awal.</li><li>Tambahkan outlet, lalu produk dan harga.</li><li>Karyawan melakukan check-in dan membuka shift.</li><li>Pilih outlet di POS, tambahkan produk, dan selesaikan pembayaran.</li><li>Proses antrean di menu Dapur dan cetak struk dari Riwayat Transaksi.</li><li>Tutup shift, lakukan backup, dan simpan file di tempat aman.</li></ol><h2>Catatan Penting</h2><p>Database disimpan di IndexedDB browser ini. Browser lain, profil lain, dan perangkat lain memiliki data berbeda. Login lokal tidak memberikan keamanan server. Google Drive OAuth, sinkronisasi realtime, BOM otomatis, payroll otomatis, dan PWA terinstal belum diimplementasikan.</p><p>Jika file dibuka dengan <code>file://</code>, dukungan IndexedDB dan konsistensi penyimpanan dapat berbeda antarbrowser. Uji backup dan restore sebelum memasukkan data penting.</p></div>`}

function openChangePin(forced=false){showModal(`<h2>${forced?'Wajib Mengganti PIN Awal':'Ubah PIN / Password'}</h2><label>PIN / Password Baru</label><input id="newPin" type="password" autocomplete="new-password"><label>Ulangi PIN / Password</label><input id="newPin2" type="password" autocomplete="new-password"><div class="row" style="margin-top:16px"><button id="pinSave">Simpan</button>${forced?'':'<button id="pinCancel" class="outline">Batal</button>'}</div>`);$('#pinSave').onclick=async()=>{let p=val('newPin');if(p.length<6||p!==val('newPin2')){toast('PIN minimal 6 karakter dan harus sama',true);return}let u=item('users',session.id);u.pin=p;u.mustChange=false;await commit('Ganti PIN',u.name,'PIN berhasil diperbarui');hideModal();render()};$('#pinCancel')?.addEventListener('click',hideModal)}
function bindPage(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=item('products',b.dataset.add);let a=cart.find(x=>x.id===p.id);if(a)a.qty++;else cart.push({id:p.id,name:p.name,price:Number(p.price),hpp:Number(p.hpp)||0,qty:1});toast('Produk masuk keranjang');render()});document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{let [act,i]=b.dataset.cart.split(':'),x=cart[+i];if(!x)return;if(act==='plus')x.qty++;if(act==='minus')x.qty--;if(act==='remove'||x.qty<=0)cart.splice(+i,1);render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let [k,id]=b.dataset.edit.split(':');formModal(k,id)});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{let [k,id]=b.dataset.toggle.split(':'),x=item(k,id);if(k==='users'&&id==='owner'){toast('Owner utama tidak dapat dinonaktifkan',true);return}x.active=x.active===false;await commit('Ubah status',k+' '+x.name);render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{let [k,id]=b.dataset.delete.split(':'),x=item(k,id);if(!confirm('Hapus '+x.name+'? Referensi pada transaksi lama tetap menggunakan nama tersimpan.'))return;state[k]=state[k].filter(y=>y.id!==id);await commit('Hapus data',k+' '+x.name);render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{let t=state.transactions.find(x=>x.id===b.dataset.status);t.status=t.status==='dibayar'?'diproses':'selesai';notify('Antrean '+t.queue+' '+t.status);await commit('Status dapur',t.queue+' → '+t.status,'Status pesanan diperbarui');render()});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printReceipt(b.dataset.print));document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidTx(b.dataset.void));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decideRequest(b.dataset.approve,'disetujui'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>decideRequest(b.dataset.reject,'ditolak'));
if(page==='pos'){$('#outletPick').onchange=e=>{activeOutlet=e.target.value};$('#productSearch').oninput=e=>{$('#productGrid').innerHTML=productCards(state.products.filter(x=>x.active&&x.name.toLowerCase().includes(e.target.value.toLowerCase())));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=item('products',b.dataset.add),a=cart.find(x=>x.id===p.id);if(a)a.qty++;else cart.push({id:p.id,name:p.name,price:Number(p.price),hpp:Number(p.hpp)||0,qty:1});render()})};$('#paymentMethod').onchange=updatePayment;$('#cashPaid')?.addEventListener('input',updatePayment);$('#checkout').onclick=checkout;$('#clearCart').onclick=()=>{if(confirm('Kosongkan keranjang?')){cart=[];render()}};updatePayment()}
if(page==='backup')$('#restoreFile').onchange=restoreFile;

function updatePayment(){let e=$('#payDetails');if(!e)return;let total=cart.reduce((n,x)=>n+x.qty*x.price,0);if(val('paymentMethod')==='qris'){e.innerHTML=state.settings.qris?`<label>QRIS Merchant</label><img alt="QRIS JUICE FREN" src="${esc(state.settings.qris)}" style="width:min(250px,100%);display:block;margin:10px auto"><label class="check"><input type="checkbox" id="qrisConfirmed"> Saya sudah memeriksa dan menerima pembayaran di rekening merchant</label>`:'<div class="notice warning">Gambar QRIS belum diunggah oleh Owner di Pengaturan. Pembayaran QRIS belum bisa dikonfirmasi.</div>'}else{e.innerHTML=`<label>Uang diterima</label><input id="cashPaid" type="number" min="0" value="${total}"><p class="sub" id="changeLabel">Kembalian: Rp 0</p>`;$('#cashPaid').oninput=()=>{$('#changeLabel').textContent='Kembalian: '+money(Math.max(0,num('cashPaid')-total))}}}
let checkoutBusy=false;async function checkout(){if(checkoutBusy)return;if(!cart.length){toast('Keranjang kosong',true);return}if(!activeOutlet){toast('Pilih outlet terlebih dahulu',true);return}if(!currentShift()){toast('Buka shift terlebih dahulu sebelum transaksi',true);return}let payment=val('paymentMethod'),total=cart.reduce((n,x)=>n+x.qty*x.price,0),paid=payment==='cash'?num('cashPaid'):total;if(payment==='cash'&&paid<total){toast('Uang tunai tidak mencukupi',true);return}if(payment==='qris'&&!$('#qrisConfirmed')?.checked){toast('Konfirmasi penerimaan pembayaran QRIS terlebih dahulu',true);return}if(!confirm(`Simpan transaksi ${money(total)} dengan ${payment==='cash'?'tunai':'QRIS manual'}?`))return;checkoutBusy=true;$('#checkout').disabled=true;let prefix=state.settings.queuePrefix||'JF',seq=state.transactions.filter(t=>day(t.at)===today()&&t.outletId===activeOutlet).length+1,queue=prefix+'-'+String(seq).padStart(3,'0'),tx={id:uid(),at:Date.now(),outletId:activeOutlet,userId:session.id,employee:session.name,queue,status:'dibayar',items:structuredClone(cart),total,payment,paid,change:paid-total,customer:val('customerName'),type:val('orderType'),note:val('orderNote'),training:false};state.transactions.unshift(tx);notify('Transaksi '+queue+' berhasil dicatat');try{await commit('Transaksi baru',tx.id+' '+money(total),'Transaksi berhasil disimpan');cart=[];render();showModal(`<h2>✓ Transaksi Berhasil</h2><p>Antrean <b>${esc(queue)}</b> · ${money(total)}</p><div class="row"><button id="printCustomer">Cetak Struk Pelanggan</button><button class="ghost" id="printKitchen">Cetak Struk Dapur</button><button class="outline" id="closeReceipt">Selesai</button></div>`);$('#printCustomer').onclick=()=>printReceipt(tx.id,false);$('#printKitchen').onclick=()=>printReceipt(tx.id,true);$('#closeReceipt').onclick=hideModal}catch(e){state.transactions=state.transactions.filter(x=>x.id!==tx.id);toast('Transaksi gagal disimpan: '+e.message,true);render()}finally{checkoutBusy=false}}
function printReceipt(id,kitchen=false){let t=state.transactions.find(x=>x.id===id);if(!t)return;let s=state.settings,lines=[s.business,s.tagline,'--------------------------------',`ID: ${t.id}`,`Antrean: ${t.queue}`,`Tanggal: ${date(t.at)}`,`Outlet: ${outletName(t.outletId)}`,`Kasir: ${t.employee}`,`Jenis: ${t.type}`,'--------------------------------',...t.items.map(x=>kitchen?`${x.qty}x ${x.name}`:`${x.name}\n ${x.qty} x ${money(x.price)} = ${money(x.qty*x.price)}`),'--------------------------------'];if(!kitchen)lines.push(`Total: ${money(t.total)}`,`Pembayaran: ${t.payment==='cash'?'Tunai':'QRIS Manual'}`,`Status: ${t.status}`,'--------------------------------','Terimakasih telah memilih Juice Fren',`Telp: ${s.phone}`);else lines.push(`Catatan: ${t.note||'-'}`,`Status: ${t.status}`);$('#printarea').innerHTML=`<pre>${esc(lines.join('\n'))}</pre>`;window.print()}
async function voidTx(id){let t=state.transactions.find(x=>x.id===id);if(!owner()||!confirm('Batalkan transaksi '+t.queue+'? Pembatalan dicatat pada audit log dan omzet dikoreksi.'))return;let reason=prompt('Alasan pembatalan (wajib):');if(!reason?.trim())return;t.status='dibatalkan';t.voidReason=reason;notify('Transaksi '+t.queue+' dibatalkan','warning');await commit('Batalkan transaksi',t.id+' '+reason);render()}
async function decideRequest(id,status){let x=item('requests',id);x.status=status;x.decidedAt=Date.now();notify('Pengajuan '+x.type+' '+status);await commit('Keputusan pengajuan',id+' '+status);render()}
async function action(act){let [type,arg]=act.split(':');if(type==='goto')return nav(arg);if(type==='add')return formModal(arg);if(type==='changePin')return openChangePin();if(type==='backup')return downloadBackup('manual');if(type==='restore')return $('#restoreFile').click();if(type==='readall'){state.notifications.forEach(x=>x.read=true);await persist();render();return}if(type==='csv')return csvExport(arg);if(type==='attendance'){let a=state.attendance.find(x=>x.userId===session.id&&day(x.at)===today()&&!x.out);if(a)a.out=Date.now();else state.attendance.unshift({id:uid(),userId:session.id,at:Date.now(),out:null});notify(a?'Check-out berhasil':'Check-in berhasil');await commit(a?'Check-out':'Check-in',session.name);render();return}if(type==='shift')return shiftAction();if(type==='expense')return expenseForm();if(type==='request')return requestForm();if(type==='saveSettings')return saveSettings();if(type==='resetStart')return resetStart()}
async function shiftAction(){let sh=currentShift();if(!sh){let cash=prompt('Masukkan modal kas awal shift (rupiah):','0');if(cash===null)return;if(!/^\d+(\.\d+)?$/.test(cash)){toast('Nominal tidak valid',true);return}state.shifts.unshift({id:uid(),userId:session.id,at:Date.now(),openCash:Number(cash),closed:null});notify('Shift '+session.name+' dibuka');await commit('Buka shift',session.name);render();return}let cash=prompt('Masukkan jumlah kas fisik saat tutup shift:','0');if(cash===null)return;if(!/^\d+(\.\d+)?$/.test(cash)){toast('Nominal tidak valid',true);return}let sale=state.transactions.filter(t=>t.userId===session.id&&t.at>=sh.at&&t.payment==='cash'&&t.status!=='dibatalkan').reduce((n,t)=>n+t.total,0),expected=sh.openCash+sale;let variance=Number(cash)-expected;if(!confirm(`Kas seharusnya ${money(expected)}. Kas dihitung ${money(cash)}. Selisih ${money(variance)}. Tutup shift?`))return;sh.closed=Date.now();sh.closeCash=Number(cash);sh.expectedCash=expected;sh.variance=variance;notify('Shift ditutup. Selisih kas: '+money(variance));await commit('Tutup shift','Selisih '+money(variance));render();toast('Shift ditutup. Silakan simpan backup setelah ini');await downloadBackup('tutup shift')}
function expenseForm(){showModal(`<h2>Catat Pengeluaran</h2><label>Keterangan</label><input id="expenseNote"><label>Nominal</label><input id="expenseAmount" type="number" min="0"><div class="row" style="margin-top:16px"><button id="expenseSave">Simpan</button><button class="outline" id="expenseCancel">Batal</button></div>`);$('#expenseCancel').onclick=hideModal;$('#expenseSave').onclick=async()=>{if(!val('expenseNote')||num('expenseAmount')<=0){toast('Isi keterangan dan nominal positif',true);return}state.expenses.unshift({id:uid(),at:Date.now(),note:val('expenseNote'),amount:num('expenseAmount')});await commit('Catat pengeluaran',val('expenseNote'));hideModal();render()}}
function requestForm(){showModal(`<h2>Pengajuan / Komplain</h2><label>Jenis</label><select id="reqType"><option>Komplain</option><option>Refund</option><option>Perubahan Transaksi</option><option>Lainnya</option></select><label>Keterangan</label><textarea id="reqNote" rows="3"></textarea><div class="row" style="margin-top:16px"><button id="reqSave">Kirim</button><button class="outline" id="reqCancel">Batal</button></div>`);$('#reqCancel').onclick=hideModal;$('#reqSave').onclick=async()=>{if(!val('reqNote').trim()){toast('Keterangan wajib diisi',true);return}state.requests.unshift({id:uid(),at:Date.now(),userId:session.id,type:val('reqType'),note:val('reqNote'),status:'menunggu'});notify('Pengajuan baru memerlukan persetujuan Owner');await commit('Buat pengajuan',val('reqType'));hideModal();render()}}
function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>1000000)return reject(Error('Gambar maksimal 1 MB untuk penyimpanan lokal'));let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
async function saveSettings(){let s=state.settings;try{let logo=await readImage($('#logoFile').files[0]),qris=await readImage($('#qrisFile').files[0]);for(let k of ['business','tagline','phone','whatsapp','queuePrefix','printer'])s[k]=val('s_'+k).trim();s.theme=val('s_theme');s.rounding=Number(val('s_rounding'));if(logo)s.logo=logo;if(qris)s.qris=qris;await commit('Ubah pengaturan','Profil usaha dan tampilan');render()}catch(e){toast(e.message,true)}}
function csvExport(key){let data=state[key];if(!Array.isArray(data))return;let cols=[...new Set(data.flatMap(x=>Object.keys(x)))],csv=[cols.join(','),...data.map(x=>cols.map(k=>'"'+String(typeof x[k]==='object'?JSON.stringify(x[k]):x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'juicefren_'+key+'_'+today()+'.csv');toast('Ekspor CSV disiapkan')}
function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function downloadBackup(type='manual'){try{let data=structuredClone(state);data.backupHistory.unshift({id:uid(),at:Date.now(),type,status:'file disiapkan'});let payload={app:APP,version:VERSION,exportedAt:new Date().toISOString(),data},json=JSON.stringify(payload),blob=new Blob([json],{type:'application/json'});downloadBlob(blob,'JUICEFREN_BACKUP_'+today()+'_'+Date.now()+'.json');state.backupHistory.unshift({id:uid(),at:Date.now(),type,status:'unduhan dimulai'});state.backupHistory=state.backupHistory.slice(0,100);backupAt=Date.now();notify('Backup '+type+' disiapkan. Pastikan file telah terunduh.');await commit('Backup file',type,'Unduhan backup dimulai. Pastikan file tersimpan.');if(page==='backup')render();return true}catch(e){toast('Backup gagal: '+e.message,true);return false}}
async function restoreFile(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!==APP||!obj.data||obj.data.schema!==1||!Array.isArray(obj.data.transactions)||!Array.isArray(obj.data.users)){throw Error('Format backup tidak cocok')}if(!confirm('Restore akan MENGGANTI seluruh data lokal saat ini. Backup data saat ini terlebih dahulu?'))return;await downloadBackup('sebelum restore');if(!confirm('Pastikan file backup sebelumnya sudah tersimpan. Lanjutkan restore?'))return;state=obj.data;await persist();session=null;sessionStorage.removeItem('jf_session');cart=[];render();toast('Restore berhasil. Silakan login kembali.')}catch(err){toast('Restore gagal: '+err.message,true)}}
async function resetStart(){if(!owner())return;let mode=val('resetMode'),password=prompt('Masukkan password Owner untuk mengonfirmasi Reset Demo:');if(password===null)return;if(password!==item('users','owner').pin){toast('Password Owner salah',true);return}let detail=mode==='transactions'?'transaksi yang ditandai mode pelatihan':mode==='operations'?'SELURUH transaksi, shift, absensi, dan stok lokal':'SELURUH database lokal';if(!confirm('Reset akan menghapus '+detail+'. Buat backup terlebih dahulu?'))return;await downloadBackup('sebelum reset');let code=prompt('Pastikan backup sudah tersimpan. Ketik RESET untuk melanjutkan:');if(code!=='RESET'){toast('Reset dibatalkan');return}if(mode==='transactions'){state.transactions=state.transactions.filter(x=>!x.training)}else if(mode==='operations'){state.transactions=[];state.shifts=[];state.attendance=[];state.inventory=[];state.expenses=[];state.requests=[]}else{state=initial();session=null;sessionStorage.removeItem('jf_session')}audit('Reset Demo',mode);await persist();cart=[];render();toast('Reset selesai')}
function checks(){if(!state.outlets.length||!state.products.length)return;let alerts=state.inventory.filter(x=>Number(x.qty)<=Number(x.min));if(alerts.length)toast(alerts.length+' bahan mencapai batas minimum',true)}
async function init(){try{db=await openDB();state=await dbRead()||initial();if(!await dbRead())await persist();let sid=sessionStorage.getItem('jf_session'),u=item('users',sid);if(u?.active)session={id:u.id,name:u.name,role:u.role};render();checks();setInterval(()=>{if(session&&state.backupHistory.length&&Date.now()-state.backupHistory[0].at>30*60000)toast('Pengingat: sudah lebih dari 30 menit sejak backup terakhir',true)},30*60000);if(!state.backupHistory.length)setTimeout(()=>toast('Belum ada backup. Gunakan menu Backup & Restore.'),1200);window.addEventListener('beforeunload',e=>{if(cart.length||currentShift()){e.preventDefault();e.returnValue=''}})}catch(err){$('#root').innerHTML=`<div class="login"><div class="loginbox"><h2>Database lokal tidak dapat dibuka</h2><p>${esc(err.message)}</p><p>Coba buka file menggunakan browser modern dengan IndexedDB diaktifkan. Jangan hapus data browser jika sebelumnya ada transaksi.</p></div></div>`}}

const originalView=view,originalBind=bindPage,originalGeneric=genericPage,originalForm=formModal,originalCheckout=checkout,originalInit=init;
const ensureExtras=()=>{for(const [k,v] of Object.entries({recipes:[],waste:[],transfers:[],stockOpname:[],purchaseOrders:[],priceHistory:[],loyaltyEvents:[],payrollRates:[],schedules:[],systemEvents:[]}))if(!Array.isArray(state[k]))state[k]=v;if(!state.settings.modules)state.settings.modules={};if(!state.settings.trainingMode)state.settings.trainingMode=false;if(!state.settings.notificationSound)state.settings.notificationSound=false;if(!state.settings.rounding)state.settings.rounding=1};
const nformat=x=>Number(x||0).toLocaleString('id-ID',{maximumFractionDigits:2});
const productOptions=()=>state.products.filter(x=>x.active).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
const ingredientOptions=()=>state.inventory.filter(x=>x.active!==false).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.unit)})</option>`).join('');

function extraPanel(title,body,actions=''){return `<section class="panel"><div class="row between"><h2>${title}</h2>${actions}</div>${body}</section>`}
function inventoryHub(){ensureExtras();let low=state.inventory.filter(x=>Number(x.qty)<=Number(x.min));return heading('Inventori & Stok','Stok bahan, resep, pembelian, waste, opname dan mutasi')+`<div class="cards"><div class="card"><div class="sub">Bahan terdaftar</div><div class="metric">${state.inventory.length}</div></div><div class="card"><div class="sub">Stok menipis</div><div class="metric">${low.length}</div></div><div class="card"><div class="sub">Resep aktif</div><div class="metric">${state.recipes.length}</div></div></div><div class="toolbar">${button('+ Tambah Bahan','add:inventory')}${button('Catat Pembelian','extra:purchase','outline')}${button('Stock Opname','extra:opname','outline')}${button('Waste / Rusak','extra:waste','outline')}${button('Transfer Stok','extra:transfer','outline')}${button('Atur Resep','extra:recipe','outline')}</div>${extraPanel('Daftar Bahan',table(['Bahan','Stok','Minimum','Aksi'],state.inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${nformat(x.qty)} ${esc(x.unit)}</td><td>${nformat(x.min)}</td><td><button class="ghost small" data-edit="inventory:${esc(x.id)}">Edit</button></td></tr>`)))}${extraPanel('Resep Produk',table(['Produk','Bahan','Jumlah / Produk'],state.recipes.map(r=>`<tr><td>${esc(productName(r.productId))}</td><td>${esc(item('inventory',r.ingredientId)?.name||'—')}</td><td>${nformat(r.qty)} ${esc(item('inventory',r.ingredientId)?.unit||'')}</td></tr>`)))}${extraPanel('Riwayat Mutasi Stok',table(['Waktu','Jenis','Bahan','Perubahan','Keterangan'],state.stockMoves.slice(0,100).map(m=>`<tr><td>${date(m.at)}</td><td>${esc(m.type)}</td><td>${esc(item('inventory',m.ingredientId)?.name||m.ingredientName||'—')}</td><td>${nformat(m.delta)}</td><td>${esc(m.note||'—')}</td></tr>`)))}`}

function payrollHub(){ensureExtras();let rates=state.payrollRates;return heading('Payroll & Kehadiran','Estimasi gaji berdasarkan tarif dan jumlah kehadiran; tidak termasuk kewajiban hukum atau pajak')+`<div class="notice warning">Perhitungan bersifat estimasi lokal. Periksa kembali jam kerja, lembur, potongan, dan peraturan ketenagakerjaan sebelum pembayaran.</div>${extraPanel('Tarif Gaji Karyawan',table(['Karyawan','Tarif / Hari','Hadir','Estimasi'],state.users.filter(u=>u.role!=='owner').map(u=>{let rate=rates.find(r=>r.userId===u.id)?.daily||0,count=state.attendance.filter(a=>a.userId===u.id&&a.out).length;return `<tr><td>${esc(u.name)}</td><td>${money(rate)}</td><td>${count}</td><td>${money(rate*count)}</td></tr>`})),button('Atur Tarif','extra:rate'))}`}
function scheduleHub(){ensureExtras();return heading('Jadwal Karyawan','Jadwal kerja manual per outlet')+extraPanel('Jadwal',table(['Tanggal','Karyawan','Outlet','Jam','Catatan'],state.schedules.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(item('users',x.userId)?.name||'—')}</td><td>${esc(outletName(x.outletId))}</td><td>${esc(x.start)} – ${esc(x.end)}</td><td>${esc(x.note||'')}</td></tr>`)),button('+ Jadwal','extra:schedule'))}
function analyticsPlus(){let tx=txReal(),byOutlet=state.outlets.map(o=>({name:o.name,items:tx.filter(t=>t.outletId===o.id)})),gross=tx.reduce((s,t)=>s+t.total,0),cost=tx.reduce((s,t)=>s+t.items.reduce((n,i)=>n+(i.hpp||0)*i.qty,0),0),expenses=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);let byProd={};tx.forEach(t=>t.items.forEach(i=>{let k=i.name;byProd[k]=(byProd[k]||0)+i.qty}));return heading('Omzet & Analitik','Rekap data transaksi yang sudah dibayar (tidak termasuk mode pelatihan)')+`<div class="cards">${[['Omzet',money(gross)],['HPP',money(cost)],['Laba Kotor',money(gross-cost)],['Laba Bersih Estimasi',money(gross-cost-expenses)]].map(([k,v])=>`<div class="card"><div class="sub">${k}</div><div class="metric">${v}</div></div>`).join('')}</div>${extraPanel('Perbandingan Outlet',table(['Outlet','Transaksi','Omzet','Target Harian'],byOutlet.map(o=>`<tr><td>${esc(o.name)}</td><td>${o.items.length}</td><td>${money(o.items.reduce((s,t)=>s+t.total,0))}</td><td>${money(state.outlets.find(x=>x.name===o.name)?.dailyTarget)}</td></tr>`)))}${extraPanel('Produk Terlaris',table(['Produk','Jumlah Terjual'],Object.entries(byProd).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`)))}${extraPanel('Metode Pembayaran',table(['Metode','Total'],['cash','qris'].map(p=>`<tr><td>${p==='cash'?'Tunai':'QRIS Manual'}</td><td>${money(tx.filter(t=>t.payment===p).reduce((s,t)=>s+t.total,0))}</td></tr>`)))}`}
function settingsPlus(){return settingsPage()+extraPanel('Pengaturan Operasional',`<label class="check"><input type="checkbox" id="trainingToggle" ${state.settings.trainingMode?'checked':''}> Aktifkan mode pelatihan (transaksi tidak masuk omzet asli)</label><label class="check"><input type="checkbox" id="soundToggle" ${state.settings.notificationSound?'checked':''}> Suara notifikasi (jika didukung browser)</label><div class="row" style="margin-top:14px"><button data-act="extra:saveFlags">Simpan Pengaturan Operasional</button></div><p class="help">Pengaturan ini hanya berlaku pada browser/perangkat yang sama.</p>`)+extraPanel('Kesehatan Sistem',`<p>Database: <b>IndexedDB lokal</b></p><p>Transaksi: <b>${state.transactions.length}</b></p><p>Shift aktif: <b>${state.shifts.filter(s=>!s.closed).length}</b></p><p>Backup terakhir: <b>${state.backupHistory.length?date(state.backupHistory[0].at):'Belum ada'}</b></p><p class="help">Penyimpanan browser tidak dijamin permanen. Lakukan ekspor backup berkala.</p>`)}
const baseView=view;view=function(){ensureExtras();if(page==='inventory')return inventoryHub();if(page==='suppliers')return purchaseHub();if(page==='payroll')return payrollHub();if(page==='schedules')return scheduleHub();if(page==='analytics')return analyticsPlus();if(page==='settings'&&owner())return settingsPlus();return baseView()};
const baseRoleMenu=roleMenu;roleMenu=function(){let g=baseRoleMenu();if(owner()){let k=g.find(x=>x[0]==='KARYAWAN');if(k)k[1].splice(2,0,['schedules','▦','Jadwal Kerja'])}return g};
function formExtra(type){ensureExtras();let templates={purchase:`<h2>Pembelian Bahan</h2><label>Supplier</label><select id="e_supplier">${state.suppliers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><label>Bahan</label><select id="e_ingredient">${ingredientOptions()}</select><label>Jumlah diterima</label><input id="e_qty" type="number" min="0.001" step="any"><label>Total biaya (Rp)</label><input id="e_amount" type="number" min="0"><label>Catatan</label><input id="e_note">`,recipe:`<h2>Atur Resep / BOM</h2><label>Produk</label><select id="e_product">${productOptions()}</select><label>Bahan</label><select id="e_ingredient">${ingredientOptions()}</select><label>Jumlah bahan per satu produk</label><input id="e_qty" type="number" min="0.001" step="any"><p class="help">Resep digunakan untuk mengurangi stok saat pembayaran transaksi.</p>`,waste:`<h2>Catat Waste / Bahan Rusak</h2><label>Bahan</label><select id="e_ingredient">${ingredientOptions()}</select><label>Jumlah terbuang</label><input id="e_qty" type="number" min="0.001" step="any"><label>Alasan</label><input id="e_note">`,opname:`<h2>Stock Opname</h2><label>Bahan</label><select id="e_ingredient">${ingredientOptions()}</select><label>Jumlah fisik terbaru</label><input id="e_qty" type="number" min="0" step="any"><label>Catatan</label><input id="e_note">`,transfer:`<h2>Transfer Stok (Pencatatan)</h2><label>Bahan</label><select id="e_ingredient">${ingredientOptions()}</select><label>Outlet asal</label><select id="e_from">${outletOptions()}</select><label>Outlet tujuan</label><select id="e_to">${outletOptions()}</select><label>Jumlah</label><input id="e_qty" type="number" min="0.001" step="any"><p class="help">Versi lokal mencatat transfer sebagai aktivitas. Stok masih berupa total gabungan, bukan saldo per outlet.</p>`,rate:`<h2>Atur Tarif Gaji Harian</h2><label>Karyawan</label><select id="e_user">${staffOptions()}</select><label>Tarif per hari (Rp)</label><input id="e_amount" type="number" min="0">`,schedule:`<h2>Tambah Jadwal Kerja</h2><label>Karyawan</label><select id="e_user">${staffOptions()}</select><label>Outlet</label><select id="e_to">${outletOptions()}</select><label>Tanggal</label><input id="e_date" type="date"><label>Mulai</label><input id="e_start" type="time"><label>Selesai</label><input id="e_end" type="time"><label>Catatan</label><input id="e_note">`};if(!templates[type])return;showModal(templates[type]+`<div class="row" style="margin-top:18px"><button id="extraSave">Simpan</button><button class="outline" id="extraCancel">Batal</button></div>`);$('#extraCancel').onclick=hideModal;$('#extraSave').onclick=()=>saveExtra(type)}
async function saveExtra(type){let ing=item('inventory',val('e_ingredient')),qty=Number(val('e_qty')),note=val('e_note').trim();if(['purchase','recipe','waste','opname','transfer'].includes(type)&&!ing){toast('Pilih bahan terlebih dahulu',true);return}if(['purchase','recipe','waste','transfer'].includes(type)&&(!Number.isFinite(qty)||qty<=0)){toast('Jumlah harus lebih dari nol',true);return}if(type==='opname'&&(!Number.isFinite(qty)||qty<0)){toast('Jumlah fisik tidak valid',true);return}let delta=0,now=Date.now();if(type==='purchase'){if(!val('e_supplier'))return toast('Tambahkan supplier terlebih dahulu',true);let amount=num('e_amount');if(amount<0)return toast('Biaya tidak valid',true);state.purchases.unshift({id:uid(),at:now,supplierId:val('e_supplier'),ingredientId:ing.id,ingredientName:ing.name,qty,amount,note});delta=qty;ing.qty=Number(ing.qty)+delta;if(amount&&qty)ing.cost=amount/qty}
if(type==='recipe'){if(!val('e_product'))return toast('Tambahkan produk terlebih dahulu',true);let r=state.recipes.find(x=>x.productId===val('e_product')&&x.ingredientId===ing.id);if(r)r.qty=qty;else state.recipes.push({id:uid(),productId:val('e_product'),ingredientId:ing.id,qty})}
if(type==='waste'){if(Number(ing.qty)<qty)return toast('Stok tidak mencukupi',true);delta=-qty;ing.qty=Number(ing.qty)+delta;state.waste.unshift({id:uid(),at:now,ingredientId:ing.id,qty,note})}
if(type==='opname'){delta=qty-Number(ing.qty);ing.qty=qty;state.stockOpname.unshift({id:uid(),at:now,ingredientId:ing.id,qty,note})}
if(type==='transfer'){if(!val('e_from')||!val('e_to')||val('e_from')===val('e_to'))return toast('Pilih outlet asal dan tujuan yang berbeda',true);state.transfers.unshift({id:uid(),at:now,ingredientId:ing.id,qty,from:val('e_from'),to:val('e_to')})}
if(['purchase','waste','opname','transfer'].includes(type))state.stockMoves.unshift({id:uid(),at:now,type,ingredientId:ing.id,ingredientName:ing.name,delta,note});
if(type==='rate'){let userId=val('e_user'),daily=num('e_amount');if(!userId||daily<0)return toast('Tarif tidak valid',true);let r=state.payrollRates.find(x=>x.userId===userId);if(r)r.daily=daily;else state.payrollRates.push({id:uid(),userId,daily})}
if(type==='schedule'){if(!val('e_user')||!val('e_to')||!val('e_date')||!val('e_start')||!val('e_end'))return toast('Lengkapi seluruh kolom jadwal',true);state.schedules.unshift({id:uid(),userId:val('e_user'),outletId:val('e_to'),date:val('e_date'),start:val('e_start'),end:val('e_end'),note})}
try{await commit('Aktivitas '+type,note||type,'Data berhasil disimpan');hideModal();render()}catch(e){toast('Gagal menyimpan: '+e.message,true)}}
const baseAction=action;action=async function(act){if(act.startsWith('extra:')){let type=act.slice(6);if(type==='saveFlags'){state.settings.trainingMode=!!$('#trainingToggle')?.checked;state.settings.notificationSound=!!$('#soundToggle')?.checked;await commit('Pengaturan operasional','Mode pelatihan / suara');render();return}if(!owner()&&['purchase','opname','waste','transfer','recipe','rate','schedule'].includes(type))return toast('Hanya Owner yang dapat mengubah data ini',true);return formExtra(type)}return baseAction(act)};
const baseBind=bindPage;bindPage=function(){baseBind();document.querySelectorAll('[data-act^="extra:"]').forEach(b=>b.onclick=()=>action(b.dataset.act))};
const baseCheckout=checkout;checkout=async function(){ensureExtras();if(state.settings.trainingMode){return trainingCheckout()}let required=new Map();for(let c of cart){for(let r of state.recipes.filter(r=>r.productId===c.id)){required.set(r.ingredientId,(required.get(r.ingredientId)||0)+Number(r.qty)*c.qty)}}for(let [id,q]of required){let i=item('inventory',id);if(!i||Number(i.qty)<q){toast('Stok bahan '+(i?.name||id)+' tidak mencukupi',true);return}}let before=state.transactions.length;await baseCheckout();if(state.transactions.length>before){for(let [id,q]of required){let i=item('inventory',id);i.qty=Number(i.qty)-q;state.stockMoves.unshift({id:uid(),at:Date.now(),type:'penjualan',ingredientId:id,ingredientName:i.name,delta:-q,note:state.transactions[0].id})}await persist()}};
async function trainingCheckout(){if(!cart.length||!activeOutlet)return toast('Pilih outlet dan produk',true);let total=cart.reduce((s,c)=>s+c.price*c.qty,0),t={id:uid(),at:Date.now(),outletId:activeOutlet,userId:session.id,employee:session.name,queue:'LATIH-'+String(state.transactions.filter(t=>t.training).length+1).padStart(3,'0'),status:'selesai',items:structuredClone(cart),total,payment:'training',paid:0,change:0,customer:val('customerName'),type:val('orderType'),note:val('orderNote'),training:true};state.transactions.unshift(t);notify('Transaksi pelatihan '+t.queue+' tersimpan');try{await commit('Transaksi pelatihan',t.id,'Simulasi berhasil disimpan (tidak masuk omzet)');cart=[];render()}catch(e){state.transactions=state.transactions.filter(x=>x.id!==t.id);toast('Gagal menyimpan simulasi',true)}}
/* Guard master-data mutations from employee accounts; read-only inventory for staff. */
const securedAction=action;action=async function(act){if(!owner()&&(/^(add|saveSettings|resetStart|expense|csv):?/.test(act)||act==='saveSettings'||act==='resetStart')){toast('Akses khusus Owner',true);return}return securedAction(act)};
const securedBind=bindPage;bindPage=function(){securedBind();if(!owner()){document.querySelectorAll('[data-edit],[data-toggle],[data-delete]').forEach(b=>{b.disabled=true;b.title='Hanya Owner'});document.querySelectorAll('[data-act^="add:"],[data-act^="extra:"]').forEach(b=>{b.disabled=true;b.title='Hanya Owner'})}};
const originalInventoryHub=inventoryHub;inventoryHub=function(){let html=originalInventoryHub();if(!owner())html=html.replace(/<button[^>]*data-act="(?:add:|extra:)[^"]*"[^>]*>.*?<\/button>/g,'').replace(/<button[^>]*data-edit="[^"]*"[^>]*>.*?<\/button>/g,'—');return html};

init();
</script></body></html>
